name: E2E Tests

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [vitest]
    env:
      BUILDX_CACHE_SCOPE: ${{ matrix.suite }}-build
      COMPOSE_FILE: test/e2e/docker-compose.yml:test/e2e/docker-compose.ci.yml

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          install: true

      - name: Expose GitHub Runtime for Docker Cache
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@3408803818f5b5065308cdf3293ecbddf1ab2fac

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git for CI
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Build and start services with Docker Compose
        run: docker compose up -d --build --wait

      - name: Debug service state
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      - name: Run vitest E2E tests
        if: matrix.suite == 'vitest'
        run: npm run test:e2e

      - name: Dump git-proxy logs on failure
        if: failure()
        run: docker compose logs git-proxy --tail=100

      - name: Stop services
        if: always()
        run: docker compose down -v

  results:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: e2e
    needs: [e2e]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check e2e results
        run: |
          result="${{ needs.e2e.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            exit 0
          else
            exit 1
          fi
